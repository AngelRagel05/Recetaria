name: Integración y seguridad

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  verify:
    name: Verificar aplicación y dependencias
    runs-on: ubuntu-24.04
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: recetaria_testing
      DB_USERNAME: postgres
      DB_PASSWORD: recetaria_ci_password
      DB_SSLMODE: disable

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: recetaria_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: recetaria_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recetaria_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno de pruebas PHP
        run: |
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing --quiet

      - name: Comprobar formato PHP
        run: vendor/bin/pint --test

      - name: Ejecutar pruebas PHP
        run: php artisan test

      - name: Auditar dependencias PHP
        run: composer audit --locked

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'

      - name: Instalar dependencias frontend
        run: npm ci --no-audit --no-fund

      - name: Comprobar frontend
        run: |
          npm run lint
          npm run format:check
          npm test
          npm run build

      - name: Auditar dependencias frontend
        run: npm audit
